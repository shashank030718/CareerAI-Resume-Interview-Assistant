
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerai-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - careerai-network

  prometheus:
    image: prom/prometheus:latest
    container_name: careerai-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - careerai-network

  grafana:
    image: grafana/grafana:latest
    container_name: careerai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - careerai-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: careerai-node-exporter
    restart: unless-stopped
    networks:
      - careerai-network

volumes:
  prometheus-data:
  grafana-data:

networks:
  careerai-network:
    driver: bridge
